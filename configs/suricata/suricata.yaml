%YAML 1.1
---
default-log-dir: /var/log/suricata
default-rule-path: /etc/suricata
rule-files:
  - lab.rules

vars:
  address-groups:
    HOME_NET: "[192.0.2.0/24]"
    EXTERNAL_NET: "!$HOME_NET"

stream:
  checksum-validation: yes

app-layer:
  protocols:
    dns:
      tcp:
        enabled: yes
        detection-ports:
          dp: 53
      udp:
        enabled: yes
        detection-ports:
          dp: 53
    http:
      enabled: yes

outputs:
  - eve-log:
      enabled: yes
      filetype: regular
      filename: eve.json
      community-id: true
      types:
        - alert
        - dns
        - http
        - flow
